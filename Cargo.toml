[package]
name = "git-backup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
ureq = { version = "3.5.0", features = ["platform-verifier"] }
