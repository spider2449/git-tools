[package]
name = "git-backup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["serde"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
ureq = { version = "3.5.0", features = ["platform-verifier"] }
